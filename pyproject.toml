[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flakeguard"
version = "1.0.0"
description = "Explainable test reliability and failure investigation"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.1,<2.2", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "defusedxml>=0.7.1,<1", "pandas>=2.2,<4", "pytest>=9.2,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "pandas-stubs>=2.2", "types-defusedxml>=0.7", "playwright>=1.49,<2"]

[project.scripts]
flakeguard = "flakeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flakeguard = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires FLAKEGUARD_TEST_DATABASE_URL", "e2e: live services or browser"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
files = ["src/flakeguard"]
strict = true

